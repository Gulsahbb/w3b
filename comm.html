<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı - İletişim</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero {
            background: url('images/commbg.jpg') no-repeat center center;
            background-size: cover;
            height: 300px;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .contact-info {
            margin-bottom: 30px;
        }

        .contact-info i {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .btn-color {
            background-color: #65451F;
            color: white;
        }

        /* Genel Stil */
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Container ve Row */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -15px;
        }

        /* Bize Ulaşın Kısmı */
        .contact-info {
            margin-bottom: 30px;
        }

        .contact-info h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #0056b3;
        }

        .contact-info p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .contact-info i {
            margin-right: 10px;
            color: #0056b3;
        }

        /* İletişim Formu */
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #0056b3;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 16px;
        }

        .form-control {
            border-radius: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #0056b3;
            box-shadow: 0 0 8px rgba(0, 86, 179, 0.1);
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            background-color: #0056b3;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #004494;
        }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .col-md-6 {
                width: 100%;
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="bg-brown">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand text-beige" href="#">Kahve Dükkanı</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="index.html">Anasayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="aboutus.html">Hakkımızda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="menu.html">Menü</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="specials.html">Specials</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="comm.html">İletişim</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>İletişim</h1>
        </div>
    </section>

    <!-- Contact Form -->
    <section class="container my-5">
        <div class="row">
            <div class="col-md-6 contact-info">
                <h2>Bize Ulaşın</h2>
                <p><i class="fas fa-map-marker-alt"></i> Adres: Örnek Mahallesi, Kahve Sokak No:1, İstanbul</p>
                <p><i class="fas fa-phone"></i> Telefon: (123) 456-7890</p>
                <p><i class="fas fa-envelope"></i> E-posta: info@kahvedukkanim.com</p>
            </div>
            <div class="col-md-6">
                <h2>İletişim Formu</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Adınız</label>
                        <input type="text" class="form-control" id="name" placeholder="Adınız" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta</label>
                        <input type="email" class="form-control" id="email" placeholder="E-posta" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mesajınız</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Mesajınız"
                            required></textarea>
                    </div>
                    <button type="submit" class="btn btn-color">Gönder</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-brown text-beige text-center py-3">
        <p>&copy; 2024 Kahve Dükkanı. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Font Awesome for icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
</body>

</html>

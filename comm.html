<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı - İletişim</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero {
            background: url('images/commbg.jpg') no-repeat center center;
            background-size: cover;
            height: 300px;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .contact-info {
            margin-bottom: 30px;
        }

        .contact-info i {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .btn-color {
            background-color: #65451F;
            color: white;
        }

        .contact-form .form-control {
            border: 1px solid #ced4da;
            /* Gri bir kenar rengi */
            border-radius: 0.25rem;
            /* Kenarları yuvarlatma */
            box-shadow: none;
            /* Gölgeleri kaldır */
            padding: 0.75rem 1.25rem;
            /* İç boşluk */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            /* Geçiş animasyonu */
        }

        .contact-form .form-control:focus {
            border-color: #80bdff;
            /* Odaklanınca kenar rengi mavi */
            outline: none;
            /* Dış çerçeveyi kaldır */
            box-shadow: 0 0 0 0.2rem rgba(38, 143, 255, 0.25);
            /* Hafif mavi gölge */
        }

        .contact-form .form-group {
            margin-bottom: 1rem;
            /* Form öğeleri arasında boşluk */
        }

        .contact-form label {
            font-weight: bold;
            /* Etiketler için kalın yazı tipi */
            margin-bottom: 0.5rem;
            /* Etiketler için alt boşluk */
            display: block;
            /* Etiketlerin tam genişlikte olması için */
        }

        .contact-form .btn-color {
            background-color: #007bff;
            /* Buton arka plan rengi */
            color: #fff;
            /* Buton metin rengi */
            border: none;
            /* Buton kenarlığı yok */
            border-radius: 0.25rem;
            /* Buton kenarları yuvarlatma */
            padding: 0.75rem 1.25rem;
            /* İç boşluk */
            font-size: 1rem;
            /* Yazı boyutu */
            cursor: pointer;
            /* Fare imlecini değiştirme */
            transition: background-color 0.3s ease;
            /* Geçiş animasyonu */
        }

        .contact-form .btn-color:hover {
            background-color: #0056b3;
            /* Hover durumunda arka plan rengi */
        }

        .contact-info {
            background: #C8AE7D;
            /* Hafif gri arka plan rengi */
            border-radius: 8px;
            /* Köşe yuvarlatma */
            padding: 20px;
            /* İç boşluk */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            /* Hafif gölge */
            margin: 10px 0;
            /* Üst ve alt boşluk */
        }

        .contact-info h2 {
            font-size: 1.75rem;
            /* Başlık boyutu */
            margin-bottom: 20px;
            /* Başlık altı boşluk */
            color: #333;
            /* Başlık rengi */
        }

        .contact-details {
            font-size: 1rem;
            /* Yazı boyutu */
            color: #555;
            /* Metin rengi */
        }

        .contact-details p {
            display: flex;
            /* Satır içi düzenleme */
            align-items: center;
            /* Dikey hizalama */
            margin-bottom: 15px;
            /* Paragraflar arası boşluk */
        }

        .contact-details i {
            font-size: 1.2rem;
            /* İkon boyutu */
            color: #007bff;
            /* İkon rengi */
            margin-right: 10px;
            /* İkon ile metin arasındaki boşluk */
        }

        .contact-details p:hover {
            color: #007bff;
            /* Metin hover durumunda renk değişimi */
            transition: color 0.3s ease;
            /* Geçiş efekti */
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="bg-brown">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand text-beige" href="#">Kahve Dükkanı</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="index.html">Anasayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="aboutus.html">Hakkımızda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="menu.html">Menü</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="specials.html">Specials</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-beige" href="comm.html">İletişim</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>İletişim</h1>
        </div>
    </section>

    <!-- Contact Form -->
    <section class="container my-5">
        <div class="row">
            <div class="col-md-6 contact-info">
                <h2>Bize Ulaşın</h2>
                <p><i class="fas fa-map-marker-alt"></i> Adres: Örnek Mahallesi, Kahve Sokak No:1, İstanbul</p>
                <p><i class="fas fa-phone"></i> Telefon: (123) 456-7890</p>
                <p><i class="fas fa-envelope"></i> E-posta: info@kahvedukkanim.com</p>
            </div>
            <div class="col-md-6">
                <h2>İletişim Formu</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Adınız</label>
                        <input type="text" class="form-control" id="name" placeholder="Adınız" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta</label>
                        <input type="email" class="form-control" id="email" placeholder="E-posta" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mesajınız</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Mesajınız"
                            required></textarea>
                    </div>
                    <button type="submit" class="btn btn-color">Gönder</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-brown text-beige text-center py-3">
        <p>&copy; 2024 Kahve Dükkanı. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Font Awesome for icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
</body>

</html>
